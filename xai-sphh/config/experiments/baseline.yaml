# Baseline experiment: Single-point, Simple Random selection, Late Acceptance.
#
# This is the simplest functional configuration and serves as the baseline
# against which all other technique combinations are compared.
#
# Run with:
#   java -jar build/libs/xai-sphh-0.1.0-SNAPSHOT.jar config/experiments/baseline.yaml
#
# techniqueName format: [SP|MP]-[CF|SR][-acceptance]
#   SP = single-point search     MP = multi-point (population) search
#   CF = Choice Function         SR = Simple Random
#   LA = Late Acceptance         AILTA = Adaptive ILTA    SA = Simulated Annealing

techniqueName: SP-SR-LA

# HyFlex domain name. Must match a key registered in DomainRegistry.
# Available: SAT, BinPacking, PersonnelScheduling, FlowShop, TSP, VRP
domain: SAT

# Zero-based instance index within the domain (0-9 for all CHeSC domains).
instanceIndex: 0

# Random seed for reproducibility. Use a different seed per replicate.
seed: 42

# Budget type: "time" (milliseconds) or "iterations" (heuristic applications).
budgetType: iterations

# Budget value in the units given by budgetType.
budgetValue: 100000

# Directory where trace CSV and run manifest JSON are written.
outputDirectory: data/raw/traces

# Technique-specific parameters (all optional; defaults shown in comments).
techniqueParameters:
  listLength: 50         # Late Acceptance list length L (default 50)
