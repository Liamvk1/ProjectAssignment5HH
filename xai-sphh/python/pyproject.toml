[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaisphh"
version = "0.1.0"
description = "Explainable AI for selection perturbative hyper-heuristics."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "lime>=0.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
xaisphh = "xaisphh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
